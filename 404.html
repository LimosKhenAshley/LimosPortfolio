<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Khen Ashley Limos</title>
    <link rel="icon" href="images/KA Logo.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #3498db, #1abc9c);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 500px; }
        .code {
            font-size: 8rem;
            font-weight: 900;
            line-height: 1;
            font-family: 'Courier New', monospace;
            text-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        h1 { font-size: 1.8rem; margin: 16px 0 12px; }
        p { font-size: 1rem; opacity: 0.85; margin-bottom: 32px; line-height: 1.6; }
        a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            background: white;
            color: #2c3e50;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        a:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">404</div>
        <h1>Page Not Found</h1>
        <p>Looks like this page doesn't exist or was moved. Let's get you back on track.</p>
        <a href="index.html"><i class="fas fa-home"></i> Back to Portfolio</a>
    </div>
</body>
</html>
